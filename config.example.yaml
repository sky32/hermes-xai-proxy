plugins:
  enabled:
    - xai-proxy-model
    - xai-proxy-web
    - xai-proxy-image
    - xai-proxy-video
    - xai-proxy-tools
    - xai-proxy-tts
    - xai-proxy-stt

# Parameters under xai_proxy.extra_params are merged into the corresponding
# request body after Hermes has built its native fields. Values here are proxy
# or upstream-specific; use the per-plugin extra_params blocks below when a
# setting should apply only to one plugin.
xai_proxy:
  # Wire protocol: openai or xai. OpenAI mode is recommended for
  # /chat/completions, image generation, TTS and STT.
  api_format: openai
  extra_params:
    images: {}
    chat: {}
    responses: {}
    messages: {}
    videos: {}
    tts: {}
    stt: {}
    web: {}

# The provider id remains "xai" for Hermes compatibility; api_format controls
# the protocol sent to the proxy.
model:
  provider: xai
  default: grok-4.7

web:
  search_backend: xai
  xai:
    model: grok-4.20-multi-agent-0309
    timeout: 120

image_gen:
  provider: xai
  model: grok-imagine-image-2.0
  # Example: n: 1, response_format: url, or stream: true for a proxy that
  # supports the image-generation SSE extension.
  extra_params: {}

video_gen:
  provider: xai
  model: grok-imagine-video
  extra_params: {}

x_search:
  model: grok-4.20-multi-agent-0309
  timeout_seconds: 180
  retries: 2

# Hermes built-in "xai" TTS cannot be shadowed by a plugin,
# therefore this project registers the proxy TTS as "xai-proxy".
tts:
  provider: xai-proxy
  xai-proxy:
    model: grok-voice-think-fast-2.0
    voice_id: eve
    language: auto
    speed: 1.0
    sample_rate: 24000
    bit_rate: 128000
    timeout: 120
    extra_params: {}

# Same rule for STT: built-ins always win, so use xai-proxy.
stt:
  provider: xai-proxy
  xai-proxy:
    model: grok-stt
    language: ""
    extra_params: {}
