name: xai-proxy-web
version: 0.1.0
description: "Override Hermes bundled xAI web-search provider and route web_search through an xAI-compatible proxy."
author: hermes-xai-proxy
kind: backend
requires_env:
  - name: XAI_PROXY_BASE_URL
    secret: false
  - name: XAI_PROXY_API_KEY
    secret: true
provides_web_providers:
  - xai
